services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/teamflow_ops
      JWT_SECRET: dev_super_secret_change_me
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongo

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
    depends_on:
      - server

volumes:
  mongo-data:
